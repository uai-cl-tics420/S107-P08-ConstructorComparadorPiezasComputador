services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:${POSTGRES_PORT}'
    volumes:
      - ./database/PostgreSQL_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 1s

  mongo:
    image: mongo:7.0
    container_name: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - '${MONGO_PORT}:${MONGO_PORT}'
    volumes:
      - ./database/MongoDB_schema.js:/docker-entrypoint-initdb.d/01-schema.js
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 1s

  bun:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bun
    ports:
      - '3000:3000'
    env_file:
      - ./.env
    environment:
      - POSTGRES_HOST=postgres
      - MONGO_HOST=mongo
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    container_name: scraper
    env_file:
      - ./.env
    environment:
      - POSTGRES_HOST=postgres
      - MONGO_HOST=mongo
      # How often to run the script (in seconds). 43200 = 12 hours, 86400 = 24 hours
      - UPDATE_INTERVAL=43200
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

volumes:
  postgres_data:
  mongo_data:
